# WANAS 350 hővisszanyerős szellőző – ESPHome konfig
# Hardver: Waveshare ESP32-S3-RS485-CAN (DIN-sínes, izolált RS485)
# Bekötés és beállítás: esphome/WANAS-350.md
#
# Regiszterek: WANAS 350/355 XF/550 DTR, 8. fejezet (ST-340 V2 vezérlő).
# A gyári leírás szerint a 2-es és 3-as regiszter (aktuális fokozat) csak
# olvasható, ezért a fokozatot a Party / Szabadság / Kandalló módokkal és a
# heti programmal lehet állítani.

substitutions:
  device_name: wanas-350
  friendly_name: "WANAS 350"
  modbus_address: "1"   # vezérlő Modbus címe (24-es regiszter, gyárilag 1)
  party_perc: "120"     # Party mód kapcsoló ennyi percre kapcsol III. fokozatra (max 720)
  kandallo_mp: "180"    # Kandalló mód hossza másodpercben (max 180)
  szabadsag_nap: "7"    # Szabadság mód (I. fokozat) hossza napokban (max 30)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret wanas_api_key

ota:
  - platform: esphome
    encryption:   # az api kulcsát használja

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WANAS 350 Fallback"
    password: !secret wanas_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ─── RS485 / Modbus ──────────────────────────────────────────────────────────
# Waveshare ESP32-S3-RS485-CAN: TX=GPIO17, RX=GPIO18, irányváltás=GPIO21.
# A WANAS oldalon a vezérlőpanel MODBUS 2 sorkapcsa (A, B) kell.
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  baud_rate: 19200
  parity: EVEN
  data_bits: 8
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart

modbus_controller:
  - id: wanas
    address: ${modbus_address}
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 10s

# ─── Szenzorok (csak olvasható) ──────────────────────────────────────────────
# Hőmérséklet: előjeles 16 bit, 0,1 °C lépés; 63066 (= -2470) érzékelőhiba.
sensor:
  # 0–1: légmennyiség, csak XF típusoknál (a WANAS 350-en 0-t ad)
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Befújt légmennyiség"
    register_type: holding
    address: 0
    unit_of_measurement: "m³/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Elszívott légmennyiség"
    register_type: holding
    address: 1
    unit_of_measurement: "m³/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  # 2–3: aktuális fokozat (szövegként lent, text_sensor alatt)
  - platform: modbus_controller
    modbus_controller_id: wanas
    id: befuvas_fokozat_raw
    internal: true
    register_type: holding
    address: 2
    on_value:
      - text_sensor.template.publish:
          id: befuvas_fokozat
          state: !lambda |-
            switch ((int) x) {
              case 0: return "Leállítva";
              case 1: return "I – üres ház";
              case 2: return "II – normál";
              case 3: return "III – szellőztetés";
              default: return "Ismeretlen";
            }

  - platform: modbus_controller
    modbus_controller_id: wanas
    id: elszivas_fokozat_raw
    internal: true
    register_type: holding
    address: 3
    on_value:
      - text_sensor.template.publish:
          id: elszivas_fokozat
          state: !lambda |-
            switch ((int) x) {
              case 0: return "Leállítva";
              case 1: return "I – üres ház";
              case 2: return "II – normál";
              case 3: return "III – szellőztetés";
              default: return "Ismeretlen";
            }

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Külső levegő hőmérséklet"
    register_type: holding
    address: 4
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Távozó levegő hőmérséklet"
    register_type: holding
    address: 5
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Befújt levegő hőmérséklet"
    register_type: holding
    address: 6
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  # A szobákból elszívott levegő hőmérséklete
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Helyiség hőmérséklet"
    register_type: holding
    address: 7
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  # Opcionális EXTRA TEMP érzékelő
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Extra hőmérséklet"
    register_type: holding
    address: 29
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  # 36: 0 = szűrőcsere kell, 1–252 = hátralévő napok
  - platform: modbus_controller
    modbus_controller_id: wanas
    id: szuro_napok
    name: "Szűrőcseréig hátralévő napok"
    register_type: holding
    address: 36
    unit_of_measurement: "d"
    icon: mdi:air-filter
    accuracy_decimals: 0

  # 37: hibaregiszter (bitek: lásd "Hibák" text_sensor)
  - platform: modbus_controller
    modbus_controller_id: wanas
    id: hibakod
    name: "Hibakód"
    register_type: holding
    address: 37
    accuracy_decimals: 0
    entity_category: diagnostic

  # 55–61, 65–69: opcionális vezeték nélküli pára- és CO2-érzékelők
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Páratartalom szoba"
    register_type: holding
    address: 55
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Páratartalom fürdő 1"
    register_type: holding
    address: 56
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Páratartalom fürdő 2"
    register_type: holding
    address: 57
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "CO2 nappali zóna"
    register_type: holding
    address: 58
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "CO2 éjszakai zóna"
    register_type: holding
    address: 59
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Páratartalom nappali zóna (CO2 érzékelő)"
    register_type: holding
    address: 60
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Páratartalom éjszakai zóna (CO2 érzékelő)"
    register_type: holding
    address: 61
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hőmérséklet szoba (páraérzékelő)"
    register_type: holding
    address: 65
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hőmérséklet fürdő 1 (páraérzékelő)"
    register_type: holding
    address: 66
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hőmérséklet fürdő 2 (páraérzékelő)"
    register_type: holding
    address: 67
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hőmérséklet nappali zóna (CO2 érzékelő)"
    register_type: holding
    address: 68
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hőmérséklet éjszakai zóna (CO2 érzékelő)"
    register_type: holding
    address: 69
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    filters:
      - lambda: 'return x == -2470 ? NAN : x * 0.1f;'

  - platform: wifi_signal
    name: "WiFi jelerősség"
    update_interval: 60s

  - platform: uptime
    name: "Üzemidő"

text_sensor:
  - platform: template
    id: befuvas_fokozat
    name: "Befúvás fokozat"
    icon: mdi:fan

  - platform: template
    id: elszivas_fokozat
    name: "Elszívás fokozat"
    icon: mdi:fan

  # A 37-es hibaregiszter bitjei (0. bit = legkisebb helyiérték)
  - platform: template
    name: "Hibák"
    icon: mdi:alert-circle-outline
    update_interval: 10s
    lambda: |-
      if (isnan(id(hibakod).state)) return {};
      static const char *const HIBAK[] = {
        "Elszívó ventilátor",
        "Befúvó ventilátor",
        "Külső levegő (czerpnia) érzékelő",
        "Elszívott levegő érzékelő",
        "Befújt levegő érzékelő",
        "Távozó levegő érzékelő",
        "Párásító hőmérséklet-érzékelő",
        "EXTRA TEMP külső érzékelő",
        "EXTRA TEMP befújt érzékelő",
        "Elszívás nyomásérzékelő",
        "Befúvás nyomásérzékelő",
      };
      uint16_t v = (uint16_t) id(hibakod).state;
      std::string s;
      for (int i = 0; i < 11; i++) {
        if (v & (1 << i)) {
          if (!s.empty()) s += ", ";
          s += HIBAK[i];
        }
      }
      return s.empty() ? std::string("Nincs hiba") : s;

# ─── Állapotok ───────────────────────────────────────────────────────────────
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "GWC működik"
    register_type: holding
    address: 30
    bitmask: 0x1
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bypass nyitva"
    register_type: holding
    address: 31
    bitmask: 0x1
    device_class: opening

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Párásító működik"
    register_type: holding
    address: 32
    bitmask: 0x1
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Utófűtő működik"
    register_type: holding
    address: 33
    bitmask: 0x1
    device_class: heat
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hűtő működik"
    register_type: holding
    address: 34
    bitmask: 0x1
    device_class: cold
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Szabadság mód aktív"
    register_type: holding
    address: 35
    bitmask: 0x1

  - platform: template
    name: "Szűrőcsere szükséges"
    device_class: problem
    lambda: |-
      if (isnan(id(szuro_napok).state)) return {};
      return id(szuro_napok).state <= 0;

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hiba"
    register_type: holding
    address: 37
    bitmask: 0x07FF
    device_class: problem

  # Digitális bemenetek a vezérlőpanelen
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bemenet I. fokozat"
    register_type: holding
    address: 46
    bitmask: 0x1
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bemenet III. fokozat"
    register_type: holding
    address: 47
    bitmask: 0x1
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bemenet konyhai elszívó"
    register_type: holding
    address: 48
    bitmask: 0x1
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bemenet tűzjelző"
    register_type: holding
    address: 49
    bitmask: 0x1
    device_class: safety

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Fagyvédelem aktív"
    register_type: holding
    address: 63
    bitmask: 0x1

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Előfűtő működik"
    register_type: holding
    address: 64
    bitmask: 0x1
    device_class: heat

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Zónacsappantyú működik"
    register_type: holding
    address: 70
    bitmask: 0x1
    disabled_by_default: true

# ─── Kapcsolók ───────────────────────────────────────────────────────────────
switch:
  # 38–40, 62: funkció engedélyezése (a tényleges működést a binary_sensorok mutatják)
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "GWC engedélyezve"
    register_type: holding
    address: 38
    bitmask: 0x1
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Bypass engedélyezve"
    register_type: holding
    address: 39
    bitmask: 0x1
    icon: mdi:valve

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Párásító engedélyezve"
    register_type: holding
    address: 40
    bitmask: 0x1
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Zónacsappantyú engedélyezve"
    register_type: holding
    address: 62
    bitmask: 0x1
    disabled_by_default: true

  # Időzített módok kényelmi kapcsolói (a hosszuk fent, a substitutions alatt állítható)
  - platform: template
    name: "Party mód"
    icon: mdi:fan-speed-3
    lambda: |-
      if (isnan(id(party_perc_num).state)) return {};
      return id(party_perc_num).state > 0;
    turn_on_action:
      - number.set:
          id: party_perc_num
          value: ${party_perc}
    turn_off_action:
      - number.set:
          id: party_perc_num
          value: 0

  - platform: template
    name: "Kandalló mód"
    icon: mdi:fireplace
    lambda: |-
      if (isnan(id(kandallo_mp_num).state)) return {};
      return id(kandallo_mp_num).state > 0;
    turn_on_action:
      - number.set:
          id: kandallo_mp_num
          value: ${kandallo_mp}
    turn_off_action:
      - number.set:
          id: kandallo_mp_num
          value: 0

  - platform: template
    name: "Szabadság mód"
    icon: mdi:fan-speed-1
    lambda: |-
      if (isnan(id(szabadsag_nap_num).state)) return {};
      return id(szabadsag_nap_num).state > 0;
    turn_on_action:
      - number.set:
          id: szabadsag_nap_num
          value: ${szabadsag_nap}
    turn_off_action:
      - number.set:
          id: szabadsag_nap_num
          value: 0

# ─── Számértékek ─────────────────────────────────────────────────────────────
number:
  # 43–45: időzített módok (0 = kikapcsolva)
  - platform: modbus_controller
    modbus_controller_id: wanas
    id: szabadsag_nap_num
    name: "Szabadság mód hossza"
    address: 43
    min_value: 0
    max_value: 30
    step: 1
    unit_of_measurement: "d"
    mode: box

  - platform: modbus_controller
    modbus_controller_id: wanas
    id: kandallo_mp_num
    name: "Kandalló mód hossza"
    address: 44
    min_value: 0
    max_value: 180
    step: 1
    unit_of_measurement: "s"
    mode: box

  - platform: modbus_controller
    modbus_controller_id: wanas
    id: party_perc_num
    name: "Party mód hossza"
    address: 45
    min_value: 0
    max_value: 720
    step: 1
    unit_of_measurement: "min"
    mode: box

  # 41–42: opcionális utófűtő / hűtő aktiválása napokra
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Utófűtés aktiválva"
    address: 41
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "d"
    mode: box
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Hűtés aktiválva"
    address: 42
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "d"
    mode: box
    disabled_by_default: true

  # 52–54: fokozatok teljesítménye. WANAS 350 (nem XF): 1–100 %.
  # XF típusnál ugyanez m³/h (10–1600) lenne.
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "I. fokozat teljesítmény"
    address: 52
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "II. fokozat teljesítmény"
    address: 53
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "III. fokozat teljesítmény"
    address: 54
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    entity_category: config
    disabled_by_default: true

  # Heti program: előbb a "Program: szerkesztett nap" selectben válaszd ki a
  # napot, utána a zónák értékei arra a napra vonatkoznak.
  # Zónák vége percben éjféltől (15 perces lépés), az 5. zóna éjfélig tart.
  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Program: 1. zóna vége"
    address: 10
    min_value: 15
    max_value: 1380
    step: 15
    unit_of_measurement: "min"
    mode: box
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Program: 2. zóna vége"
    address: 11
    min_value: 30
    max_value: 1395
    step: 15
    unit_of_measurement: "min"
    mode: box
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Program: 3. zóna vége"
    address: 12
    min_value: 45
    max_value: 1410
    step: 15
    unit_of_measurement: "min"
    mode: box
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Program: 4. zóna vége"
    address: 13
    min_value: 60
    max_value: 1425
    step: 15
    unit_of_measurement: "min"
    mode: box
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: wanas
    name: "Program: 1. zóna komforthőmérséklet"
    address: 19
    min_value: 10
    max_value: 30
    step: 1
    unit_of_measurement: "°C"
