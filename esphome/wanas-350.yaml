button:
  # Dátum: nap<<11 | hónap<<7 | (év-2000); idő: óra<<8 | perc
  # (a DTR 12:55 = 0x0C37 példája alapján)
  - platform: template
    name: "Óra szinkronizálása"
    icon: mdi:clock-check-outline
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: return id(ha_time).now().is_valid();
          then:
            - number.set:
                id: wanas_datum
                value: !lambda |-
                  auto t = id(ha_time).now();
                  return (t.day_of_month << 11) | (t.month << 7) | (t.year - 2000);
            - number.set:
                id: wanas_ido
                value: !lambda |-
                  auto t = id(ha_time).now();
                  return (t.hour << 8) | t.minute;

  - platform: restart
    name: "Újraindítás"
